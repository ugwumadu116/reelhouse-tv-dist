server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Stock mime.types has no entry for .apk, and without this a TV browser is handed
    # application/octet-stream — which some of them render as text instead of downloading.
    types {
        text/html                               html;
        text/css                                css;
        image/svg+xml                           svg;
        image/png                               png;
        application/json                        json;
        application/vnd.android.package-archive apk;
    }
    default_type application/octet-stream;

    # /a.apk is the whole point: it is the shortest thing a person can type on a D-pad
    # keyboard. The long name is kept for anyone downloading on a laptop.
    location = /a.apk {
        alias /usr/share/nginx/html/ReelHouse.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="ReelHouse.apk"';
        add_header Cache-Control 'no-cache';
    }

    location = /ReelHouse.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="ReelHouse.apk"';
        add_header Cache-Control 'no-cache';
    }

    # What the app polls to find out a new build exists. Never cached: the whole point is
    # that it is right within a minute of a push.
    location = /version.json {
        default_type application/json;
        add_header Cache-Control 'no-store';
    }

    # Cheap TV browsers choke on a missing favicon far more than they should.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
